name: busnap
description: "Alerts you when approaching your bus stop."
publish_to: none
version: 1.0.7+9

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Location & permissions
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Geocoding types (LatLng used across services)
  latlong2: ^0.9.0

  # Search & routing (Nominatim + Valhalla — no API keys required)
  http: ^1.2.1

  # Notifications
  flutter_local_notifications: ^17.2.4

  # Alarm sound
  audioplayers: ^5.2.1
  file_picker: ^8.1.7

  # Persistence
  shared_preferences: ^2.2.2
  path_provider: ^2.1.4

  # Network check
  connectivity_plus: ^5.0.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/alarm.mp3

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
