<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Busnap — Smart Proximity Alarm for Bus & Transit Commuters</title>
    <meta name="title" content="Busnap — Smart Proximity Alarm for Bus & Transit Commuters" />
    <meta name="description" content="Never miss your stop again. Busnap runs in the background and alerts you at 5km, 2km, and 1km before your destination. 100% private, zero tracking, open source." />
    <meta name="theme-color" content="#1DB56A" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Busnap — Sleep Peacefully on Your Commute" />
    <meta property="og:description" content="Smart proximity alarms for transit commuters. Alerts at 5km, 2km, and 1km. 100% private & on-device." />
    <meta property="og:image" content="/logo.png" />

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0c1410] text-[#E8F2EC] font-sans antialiased selection:bg-[#1DB56A]/25 selection:text-[#1DB56A] overflow-x-hidden min-h-screen">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>

    <!-- 💬 BusNap AI Chatbot (Powered by ZeroRoute) -->
    <script 
      src="https://zeroroute.mapki.in/widget.js" 
      data-endpoint="https://zeroroute.mapki.in"
      data-title="BusNap AI"
      data-avatar="/logo.png"
      data-color="#1DB56A"
      data-greeting="Hey! 🚌 Welcome to BusNap. Ask me how our GPS alarm keeps you from missing your bus stop!"
      data-prompts="How does the location alarm work?,Does it drain my battery?,Can it work in the background?,Is it free to download?"
      data-persona="You are BusNap AI, the assistant for BusNap — the smart GPS-based alarm app that wakes you up before reaching your destination."
      data-knowledge-url="/knowledge.md"
      data-knowledge="BusNap Features: Location-based GPS wake-up alarm, progressive multi-stage alarms (5km, 2km, 1km), background monitoring with foreground service, 100% on-device privacy (no accounts, no tracking), battery efficiency (<1% drain), custom alarm sounds (MP3/WAV/OGG), OpenStreetMap road distance calculation via Nominatim/Valhalla/OSRM, works on buses and trains. Available on Google Play Store."
      defer>
    </script>
  </body>
</html>
