      data-knowledge="BusNap Features: Location-based GPS wake-up alarm, progressive multi-stage alarms (5km notification, 2km preparation chime, 1km wake-up alarm), background monitoring with foreground service (<1% battery), 100% on-device privacy (no accounts, no tracking), custom alarm sounds (MP3/WAV/OGG), OpenStreetMap road distance calculation via Nominatim/Valhalla/OSRM, works on buses and trains. Available on Google Play Store: https://play.google.com/store/apps/details?id=com.busnap.app. Open source MIT on GitHub: https://github.com/amjadlle/busnap. Created by Amjad P A (https://amjad.mapki.in)."
